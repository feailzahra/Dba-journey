const shrink=(file,max,q=.72)=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=URL.createObjectURL(file)});

{const h0=new Date().getHours();document.documentElement.dataset.theme=h0>=6&&h0<18?'day':'night'}
function Login({onMsg}){
 const[mode,setMode]=useState('in'),[f,setF]=useState({name:'',email:'',pw:''}),[rem,setRem]=useState(true),[err,setErr]=useState(''),[busy,setBusy]=useState(false);
 const set=k=>e=>setF({...f,[k]:e.target.value});
 const run=async fn=>{setErr('');if(!CONFIGURED)return setErr('Add your Supabase URL and key at the top of index.html first.');setBusy(true);try{await fn()}catch(e){setErr(e.message||'Something went wrong.')}setBusy(false)};
 const submit=e=>{e.preventDefault();run(async()=>{
  if(!f.email||!f.pw)throw new Error('Enter your email and password.');
  useRemember(rem);
  if(mode==='up'){const{data,error}=await sb.auth.signUp({email:f.email.trim(),password:f.pw,options:{data:{name:f.name.trim()}}});if(error)throw error;

  else{const{error}=await sb.auth.signInWithPassword({email:f.email.trim(),password:f.pw});if(error)throw error}})};
 const demo=()=>run(async()=>{useRemember(true);const{error}=await sb.auth.signInAnonymously();if(error)throw error});
 return html`<main class="grid md:grid-cols-2 min-h-screen fade">
  <section class="rel overflow-hidden p-8 md:p-12 flex flex-col justify-end text-white" style=${{background:'linear-gradient(140deg,#0d1f3c,#1d3f7a)',minHeight:240}}><${Shapes}/>
   <div class="rel"><h1 class="text-4xl font-extrabold m-0">DBA Research Journey</h1><p class="mt-3 mb-0 max-w-sm" style=${{opacity:.85}}>Plan daily tasks, capture research notes and count down to submission, synced across all your devices.</p></div></section>
  <section class="grid place-items-center p-6"><div class="w-full max-w-sm">
   <h2 class="text-2xl font-bold m-0">${mode==='in'?'Welcome back':'Create your account'}</h2>
   <p class="mu mt-1 mb-5">${mode==='in'?'Log in to continue your research.':'Your data will sync to every device you log in on.'}</p>
   ${!CONFIGURED&&html`<p class="p-3 rounded-lg" style=${{background:'#fff4e0',color:'#7a4a00'}}>Setup needed: add your Supabase URL and key at the top of <b>index.html</b>.</p>`}
   <form onSubmit=${submit} class="grid gap-3">
    ${mode==='up'&&html`<label class="grid gap-1">Your name<input class="in" value=${f.name} onInput=${set('name')} autocomplete="name"/></label>`}
    <label class="grid gap-1">Email<input class="in" type="email" value=${f.email} onInput=${set('email')} autocomplete="email"/></label>
    <label class="grid gap-1">Password<input class="in" type="password" value=${f.pw} onInput=${set('pw')} autocomplete=${mode==='in'?'current-password':'new-password'}/></label>
    <div class="flex items-center gap-2"><button type="button" class="sw" role="switch" aria-checked=${rem} aria-label="Remember me" onClick=${()=>setRem(!rem)}><i></i></button><span>Remember me</span></div>
    ${err&&html`<p class="m-0" role="alert" style=${{color:'var(--cor)'}}>${err}</p>`}
    <button class="bt" disabled=${busy}>${busy?'Please wait…':mode==='in'?'Log in':'Create account'}</button></form>
   <button class="bt b2 w-full mt-3" onClick=${demo} disabled=${busy}>Try the demo account</button>
   <button class="x mt-3" onClick=${()=>{setMode(mode==='in'?'up':'in');setErr('')}}>${mode==='in'?'New here? Create an account':'Have an account? Log in'}</button>
  </div></section></main>`}

function Alarms({s,saveS,say}){
 const[al,setAl]=useState([]),[f,setF]=useState({label:'',note:'',at:''}),[ring,setRing]=useState(null),[pad,setPad]=useState(s.scratch||'');
 const load=async()=>{const{data,error}=await sb.from('alarms').select('*').order('remind_at');if(error)say(error.message);else setAl(data)};
 useEffect(()=>{load()},[]);
 useEffect(()=>{const t=setInterval(()=>{if(ring)return;const a=al.find(x=>!x.done&&new Date(x.remind_at).getTime()<=Date.now());if(a){setRing(a);beep();try{if(Notification.permission==='granted')new Notification('DBA alarm: '+a.label,{body:a.note||''})}catch(e){}}},4000);return()=>clearInterval(t)},[al,ring]);
 useEffect(()=>{if(pad===(s.scratch||''))return;const t=setTimeout(()=>saveS({scratch:pad}),900);return()=>clearTimeout(t)},[pad]);
 const add=async e=>{e.preventDefault();if(!f.at)return say('Choose a date and time for the alarm.');const{data,error}=await sb.from('alarms').insert({label:f.label.trim()||'Alarm',note:f.note.trim(),remind_at:new Date(f.at).toISOString()}).select().single();if(error)return say(error.message);setAl([...al,data].sort((a,b)=>new Date(a.remind_at)-new Date(b.remind_at)));setF({label:'',note:'',at:''})};
 const upd=async(a,p)=>{setAl(al.map(x=>x.id===a.id?{...x,...p}:x));setRing(null);const{error}=await sb.from('alarms').update(p).eq('id',a.id);if(error){say(error.message);load()}};
 const del=async id=>{setAl(al.filter(x=>x.id!==id));await sb.from('alarms').delete().eq('id',id)};
 const wh={color:'#fff',borderColor:'#fff'};
 return html`<section class="card" style=${{'--c':'var(--cor)'}} aria-label="Alarms and notepad"><h2 class="text-xl font-bold m-0 mb-3">Alarms & notepad</h2>
  ${ring&&html`<div role="alert" class="p-3 mb-3" style=${{background:'var(--cor)',color:'#fff',borderRadius:10}}><b>⏰ ${ring.label}</b><div>${ring.note}</div><div class="flex gap-2 mt-2"><button class="bt b2" style=${wh} onClick=${()=>upd(ring,{remind_at:new Date(Date.now()+3e5).toISOString()})}>Snooze 5 min</button><button class="bt b2" style=${wh} onClick=${()=>upd(ring,{done:true})}>Done</button></div></div>`}
  <div class="grid gap-4 md:grid-cols-2"><div>
   <form onSubmit=${add} class="grid gap-2"><input class="in" placeholder="Alarm label (e.g. Read 2 papers)" value=${f.label} onInput=${e=>setF({...f,label:e.target.value})}/><input type="datetime-local" class="in" aria-label="Alarm time" value=${f.at} onInput=${e=>setF({...f,at:e.target.value})}/><textarea class="in" rows="2" placeholder="Note shown when it rings (optional)" value=${f.note} onInput=${e=>setF({...f,note:e.target.value})}></textarea><button class="bt">Set alarm</button></form>
   <button class="x mt-1" onClick=${()=>{try{Notification.requestPermission()}catch(e){}}}>Enable pop-up alerts</button><p class="mu text-xs m-0">Alarms ring while this page is open on any of your devices.</p>
   <ul class="list-none p-0 mt-2">${al.filter(a=>!a.done).map(a=>html`<li key=${a.id} class="flex justify-between gap-2 py-1" style=${{borderBottom:'1px solid var(--line)'}}><span><b>${a.label}</b><br/><span class="mu text-xs">${fmt(a.remind_at)}${a.note?' · '+a.note:''}</span></span><button class="x" onClick=${()=>del(a.id)}>Delete</button></li>`)}</ul></div>
   <label class="grid gap-1 content-start">Quick notepad (saves automatically)<textarea class="in" rows="9" value=${pad} onInput=${e=>setPad(e.target.value)}></textarea></label></div></section>`}

function Research({s,saveS,touch,say}){
 const[cm,setCm]=useState([]),[f,setF]=useState({chapter:s.current_chapter||CH[1],text:''}),[fo,setFo]=useState(s.focus_topic||''),[kw,setKw]=useState((s.focus_keywords||[]).join(', ')),[th,setTh]=useState((s.theories||[]).join(', ')),[fl,setFl]=useState('open');
 const load=async()=>{const{data,error}=await sb.from('comments').select('*').order('created_at',{ascending:false});if(error)say(error.message);else setCm(data)};
 useEffect(()=>{load()},[]);
 const add=async e=>{e.preventDefault();if(!f.text.trim())return;const{data,error}=await sb.from('comments').insert({chapter:f.chapter,text:f.text.trim()}).select().single();if(error)return say(error.message);setCm([data,...cm]);setF({...f,text:''});touch({tab:'research'})};
 const tog=async c=>{setCm(cm.map(x=>x.id===c.id?{...x,done:!x.done}:x));const{error}=await sb.from('comments').update({done:!c.done}).eq('id',c.id);if(error){say(error.message);load()}};
 const del=async id=>{setCm(cm.filter(x=>x.id!==id));await sb.from('comments').delete().eq('id',id)};
 const shown=cm.filter(c=>fl==='all'||c.done===(fl==='done'));
 return html`<div class="grid gap-5 lg:grid-cols-2">
  <section class="card" style=${{'--c':'var(--ind)'}}><h2 class="text-xl font-bold m-0 mb-1">Research focus</h2><p class="mu mt-0 mb-3">Your topic, keywords and theories power the paper relevance scan in Library.</p>
   <div class="grid gap-3">
    <label class="grid gap-1">Focus topic<input class="in" placeholder="e.g. Knowledge–action gap in e-wallet scam susceptibility" value=${fo} onInput=${e=>setFo(e.target.value)} onBlur=${()=>saveS({focus_topic:fo.trim()})}/></label>
    <label class="grid gap-1">Keywords (comma-separated)<input class="in" placeholder="scam, phishing, e-wallet, self-efficacy" value=${kw} onInput=${e=>setKw(e.target.value)} onBlur=${()=>saveS({focus_keywords:tg(kw)})}/></label>
    <label class="grid gap-1">Related theories (comma-separated)<input class="in" placeholder="protection motivation theory, theory of planned behaviour" value=${th} onInput=${e=>setTh(e.target.value)} onBlur=${()=>saveS({theories:tg(th)})}/></label>
    <label class="grid gap-1">Chapter I’m working on now<select class="in" value=${s.current_chapter||''} onChange=${e=>{saveS({current_chapter:e.target.value});touch({tab:'research'})}}><option value="">Not set</option>${CH.map(c=>html`<option key=${c}>${c}</option>`)}</select></label></div></section>
  <section class="card" style=${{'--c':'var(--cor)'}}><h2 class="text-xl font-bold m-0 mb-3">Supervisor comments</h2>
   <form onSubmit=${add} class="grid gap-2 mb-3"><select class="in" value=${f.chapter} onChange=${e=>setF({...f,chapter:e.target.value})}>${CH.map(c=>html`<option key=${c}>${c}</option>`)}</select><textarea class="in" rows="3" placeholder="Paste or type the comment…" value=${f.text} onInput=${e=>setF({...f,text:e.target.value})}></textarea><button class="bt">Add comment</button></form>
   <div class="flex gap-2 mb-2">${[['open','Open'],['done','Resolved'],['all','All']].map(x=>html`<button key=${x[0]} class=${'bt b2 '+(fl===x[0]?'on':'')} onClick=${()=>setFl(x[0])}>${x[1]}</button>`)}</div>
   ${!shown.length&&html`<p class="mu">Nothing here yet.</p>`}
   <ul class="list-none p-0 m-0">${shown.map(c=>html`<li key=${c.id} class="flex items-start gap-2 py-2" style=${{borderBottom:'1px solid var(--line)'}}><input type="checkbox" class="mt-1" checked=${c.done} aria-label="Resolved" onChange=${()=>tog(c)}/><div class="flex-1"><span class="chip" style=${{background:'var(--soft)',color:'var(--mu)'}}>${c.chapter}</span><div style=${{whiteSpace:'pre-wrap',opacity:c.done?.55:1}}>${c.text}</div><span class="mu text-xs">${fmt(c.created_at)}</span></div><button class="x" onClick=${()=>del(c.id)}>Delete</button></li>`)}</ul></section></div>`}

function Library({s,touch,say}){
 const P0={title:'',citation:'',url:'',abstract:'',tags:'',doc_id:''},D0={title:'',url:'',kind:KINDS[0]};
 const[docs,setDocs]=useState([]),[ps,setPs]=useState([]),[pf,setPf]=useState(P0),[df,setDf]=useState(D0);
 const load=async()=>{const[a,b]=await Promise.all([sb.from('docs').select('*').order('created_at',{ascending:false}),sb.from('papers').select('*').order('created_at',{ascending:false})]);if(a.error||b.error)say((a.error||b.error).message);else{setDocs(a.data);setPs(b.data)}};
 useEffect(()=>{load()},[]);
 const terms=()=>{const z=new Set();[...(s.focus_keywords||[]),...(s.theories||[])].forEach(k=>z.add(k.toLowerCase()));(s.focus_topic||'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3&&!STOP.has(w)).forEach(w=>z.add(w));return[...z]};
 const rel=p=>{const T=terms();if(!T.length)return null;const x=(p.title+' '+p.abstract+' '+(p.tags||[]).join(' ')).toLowerCase(),hit=T.filter(t=>x.includes(t));return{hit,sc:hit.length/T.length}};
 const addD=async e=>{e.preventDefault();const u=safe(df.url);if(!df.title.trim()||!u)return say('Add a title and a link that starts with https://');const{data,error}=await sb.from('docs').insert({title:df.title.trim(),url:u,kind:df.kind}).select().single();if(error)return say(error.message);setDocs([data,...docs]);setDf(D0)};
 const addP=async e=>{e.preventDefault();if(!pf.title.trim())return;const u=pf.url.trim();if(u&&!safe(u))return say('Paper link must start with https://');
  const{data,error}=await sb.from('papers').insert({title:pf.title.trim(),citation:pf.citation.trim(),url:u,abstract:pf.abstract.trim(),tags:tg(pf.tags),doc_id:pf.doc_id||null}).select().single();if(error)return say(error.message);
  setPs([data,...ps]);setPf(P0);const q=rel(data);if(q&&!q.hit.length)say('⚠ Saved, but this paper does not appear related to your research focus.');touch({tab:'library'})};
 const del=async(t,id)=>{(t==='docs'?setDocs:setPs)(x=>x.filter(y=>y.id!==id));await sb.from(t).delete().eq('id',id)};
 const flagged=ps.filter(p=>{const q=rel(p);return q&&!q.hit.length}).length;
 const badge=p=>{const q=rel(p);if(!q)return html`<span class="chip" style=${{background:'var(--soft)',color:'var(--mu)'}}>Set a focus to scan</span>`;
  const[bg,tx]=!q.hit.length?['#e03b4d22','#e03b4d']:q.sc<.2?['#e08a0022','var(--amb)']:['#0ca67822','var(--teal)'];

     <div class="flex justify-between gap-2"><h3 class="m-0 font-bold">${n.title||'Untitled'}</h3><div class="shrink-0"><button class="x" onClick=${()=>{setNf({id:n.id,title:n.title,body:n.body,tags:n.tags.join(', ')});window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}}>Edit</button><button class="x" onClick=${()=>delN(n.id)}>Delete</button></div></div>
     <p class="mu text-xs mt-0 mb-2">${fmt(n.created_at)}${n.edited_at?' · edited '+fmt(n.edited_at):''}</p>
     <p class="m-0 mb-2" style=${{whiteSpace:'pre-wrap'}}>${n.body}</p>
     <div class="flex gap-1 flex-wrap">${n.tags.map(t=>html`<button class="chip" key=${t} style=${{background:'color-mix(in srgb,var(--amb) 18%,transparent)',color:'var(--amb)',cursor:'pointer'}} onClick=${()=>setQ(t)}>#${t}</button>`)}</div></article>`)}</div></section>
  </div>

  ${tab==='research'&&!loading&&html`<${Research} s=${s} saveS=${saveS} touch=${touch} say=${say}/>`}${tab==='library'&&!loading&&html`<${Library} s=${s} touch=${touch} say=${say}/>`}
  <footer class="card flex flex-wrap items-center gap-2" style=${{'--c':'var(--cor)'}} aria-label="Backup">
   <strong class="mr-2"><span class="dot" style=${{background:'var(--cor)'}}></span>Backup</strong>
   <button class="bt b2" onClick=${expJ}>Export JSON</button><button class="bt b2" onClick=${expC}>Export CSV</button>
   <label class="bt b2 m-0" style=${{cursor:'pointer'}}>Import backup (JSON)<input type="file" accept=".json,application/json" class="hidden" onChange=${imp}/></label>
   <span class="mu text-sm" role="status">${msg||'Synced to your account. Changes appear on all your devices.'}</span></footer></div>`}

function App(){
 const[u,setU]=useState(null),[ready,setReady]=useState(false);
 useEffect(()=>{if(!sb){setReady(true);return}
  sb.auth.getSession().then(({data})=>{setU(data.session?.user??null);setReady(true)});
  const{data:l}=sb.auth.onAuthStateChange((_e,s)=>setU(s?.user??null));return()=>l.subscription.unsubscribe()},[]);
 if(!ready)return html`<p class="p-6 mu">Loading…</p>`;
 return u?html`<${Dash} key=${u.id} user=${u}/>`:html`<${Login}/>`}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script></body></html>
